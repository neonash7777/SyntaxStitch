name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the VS Code Marketplace
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate publisher configuration
        run: test -n "$VSCE_PUBLISHER" && npm pkg set publisher="$VSCE_PUBLISHER"
      - name: Validate release version
        if: github.event_name == 'release'
        run: test "${{ github.event.release.tag_name }}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - name: Test scanner and scope policies
        run: npm run test:unit
      - name: Test extension
        run: xvfb-run -a npm test
      - name: Package VSIX
        run: npx vsce package --out "syntaxstitch-${{ github.ref_name }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: syntaxstitch-vsix
          path: "*.vsix"
      - name: Attach VSIX to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" ./*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to VS Code Marketplace
        if: github.event_name == 'release' || inputs.publish
        run: npx vsce publish --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}